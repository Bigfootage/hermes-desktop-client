name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install required npm version
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bundle verified Cua Windows runtime
        shell: pwsh
        run: |
          $url = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.23.2/cua-driver-rs-0.23.2-windows-x86_64-binary.zip"
          $zip = Join-Path $env:RUNNER_TEMP "cua-driver.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = "27a41831d5dda71082b58154ff87966a9ad8131ce66e8060da2d860558655c13"
          if ($actual -ne $expected) { throw "Cua runtime checksum mismatch" }
          $destination = "src-tauri/resources/cua-driver"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -Path $zip -DestinationPath $destination -Force

      - name: Build NSIS and MSI installers
        run: npm run tauri build -- --bundles nsis,msi --config '{"bundle":{"resources":{"resources/cua-driver/*":"cua-driver/"}}}'

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-windows-installers
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
