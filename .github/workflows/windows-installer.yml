name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bundle verified Cua Windows runtime
        shell: pwsh
        run: |
          $url = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.23.2/cua-driver-rs-0.23.2-windows-x86_64-binary.zip"
          $zip = Join-Path $env:RUNNER_TEMP "cua-driver.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = "27a41831d5dda71082b58154ff87966a9ad8131ce66e8060da2d860558655c13"
          if ($actual -ne $expected) { throw "Cua runtime checksum mismatch" }
          $destination = "src-tauri/resources/cua-driver"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -Path $zip -DestinationPath $destination -Force

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install required npm version
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bundle verified Cua Windows runtime
        shell: pwsh
        run: |
          $url = "https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.23.2/cua-driver-rs-0.23.2-windows-x86_64-binary.zip"
          $zip = Join-Path $env:RUNNER_TEMP "cua-driver.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = "27a41831d5dda71082b58154ff87966a9ad8131ce66e8060da2d860558655c13"
          if ($actual -ne $expected) { throw "Cua runtime checksum mismatch" }
          $destination = "src-tauri/resources/cua-driver"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -Path $zip -DestinationPath $destination -Force

      - name: Exercise bundled Cua runtime on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $driver = (Get-ChildItem "src-tauri/resources/cua-driver" -Recurse -Filter "cua-driver.exe" | Select-Object -First 1).FullName
          if (-not $driver) { throw "Bundled cua-driver.exe was not found" }
          $manifest = & $driver manifest | ConvertFrom-Json
          if ([version]$manifest.binary_version -lt [version]"0.23.2") { throw "Unexpected Cua runtime version" }

          $capabilities = Join-Path $env:RUNNER_TEMP "phase-d-capabilities.yaml"
          @"
          version: 3
          expires_after: 15m
          idle_timeout: 5m
          allow:
            tools:
              - health_report
              - get_screen_size
              - list_apps
              - list_windows
              - get_accessibility_tree
              - get_desktop_state
              - click
              - type_text
              - press_key
          resources:
            apps: []
            desktop:
              display: true
          "@ | Set-Content -Encoding utf8NoBOM $capabilities

          $socket = "\\.\pipe\hermes-phase-d-ci-$env:GITHUB_RUN_ID"
          $daemon = Start-Process -FilePath $driver -ArgumentList @(
            "serve", "--permission-mode", "bounded",
            "--capability-manifest", $capabilities,
            "--approve-capability-manifest", "--socket", $socket
          ) -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              & $driver status --socket $socket *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Cua daemon did not become ready" }
            $health = & $driver call health_report '{}' --socket $socket
            if ($LASTEXITCODE -ne 0 -or -not $health) { throw "Cua health_report failed" }
            $screen = & $driver call get_screen_size '{}' --socket $socket
            if ($LASTEXITCODE -ne 0 -or -not $screen) { throw "Cua display observation failed" }
          } finally {
            & $driver stop --socket $socket *> $null
            if (-not $daemon.HasExited) { Stop-Process -Id $daemon.Id -Force }
          }

      - name: Build NSIS and MSI installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-windows-installers
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
